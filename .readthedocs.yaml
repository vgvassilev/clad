version: 2

sphinx:
  configuration: docs/userDocs/source/conf.py
  builder: html

# Without this readthedocs installs only its own Sphinx, so the pins in
# requirements.txt -- including the theme -- never reach the build.
python:
  install:
    - requirements: requirements.txt

build:
  os: "ubuntu-24.04"
  tools:
    python: "3.11"
  jobs:
    # The options page is rendered from lib/Differentiator/Options.td, which
    # is where every option clad takes is written down. readthedocs runs
    # sphinx itself rather than the cmake target that would render it, so the
    # tool that does is built here; the apt packages below carry the LLVM it
    # needs.
    pre_build:
      - cmake -S . -B /tmp/clad-td -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
        -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang -DCLAD_DISABLE_TESTS=ON
      - cmake --build /tmp/clad-td --target clad-options
  apt_packages:
    - clang-18
    - cmake
    # The internal documentation is doxygen output, and its graphs are dot.
    # Both happen to be in the image; neither was asked for.
    - doxygen
    - graphviz
    - libclang-18-dev
    - llvm-18-dev
    - llvm-18-tools

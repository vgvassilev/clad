name: Main
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Pre-flight job to activate the cuda infrastructure
  prepare-dell:
    name: Activate self-host infrastructure
    runs-on: [self-hosted, spotter]
    steps:
      - uses: compiler-research/ci-workflows/actions/wake-on-lan@main
        with:
          mac: a4:bb:6d:51:d5:d2
          target-host: 192.168.100.30

  build:
    timeout-minutes: 600 # If some self-host machine is not available
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:

        include:
          # --- LINUX: Last 11 Runtimes (12-22) ---
          # Using Ubuntu 22.04 for older runtimes, 24.04 for newer ones
          - { name: ubu22-gcc11-runtime12, os: ubuntu-22.04, compiler: gcc-11, clang-runtime: '12' }
          - { name: ubu22-clang13-runtime13, os: ubuntu-22.04, compiler: clang-13, clang-runtime: '13' }
          - { name: ubu24-gcc13-runtime14, os: ubuntu-24.04, compiler: gcc-13, clang-runtime: '14' }
          - { name: ubu24-clang15-runtime15, os: ubuntu-24.04, compiler: clang-15, clang-runtime: '15' }
          - { name: ubu24-gcc14-runtime16, os: ubuntu-24.04, compiler: gcc-14, clang-runtime: '16' }
          - { name: ubu24-clang16-runtime17, os: ubuntu-24.04, compiler: clang-16, clang-runtime: '17' }
          - { name: ubu24-gcc14-runtime18, os: ubuntu-24.04, compiler: gcc-14, clang-runtime: '18' }
          - { name: ubu24-clang17-runtime19, os: ubuntu-24.04, compiler: clang-17, clang-runtime: '19' }
          - { name: ubu24-clang19-runtime20, os: ubuntu-24.04, compiler: clang-19, clang-runtime: '20', cuda: '12.6.3' }
          - { name: ubu24-clang20-runtime21, os: ubuntu-24.04, compiler: clang-20, clang-runtime: '21', cuda: '12.8.1' }
          - { name: ubu24-clang20-runtime22, os: ubuntu-24.04, compiler: clang-20, clang-runtime: '22', cuda: '13.0.3' }
          - { name: ubu24-clang22-runtime22-asan, os: ubuntu-24.04, compiler: clang-22, clang-runtime: '22', flavor: asan, extra_cmake_options: '-DLLVM_USE_SANITIZER=Address' }
          # --- MACOS: Last 5 Runtimes (17-21) ---
          # Using macOS ARM (standard) for all; Runtime 17 on Intel for x86 sanity
          - { name: osx-intel-runtime17, os: macos-15-intel, compiler: clang, clang-runtime: '17' }
          - { name: osx-arm-runtime18, os: macos-26, compiler: clang, clang-runtime: '18' }
          - { name: osx-arm-runtime19, os: macos-26, compiler: clang, clang-runtime: '19' }
          - { name: osx-arm-runtime20, os: macos-26, compiler: clang, clang-runtime: '20' }
          - { name: osx-arm-runtime21, os: macos-26, compiler: clang, clang-runtime: '21' }

          # --- WINDOWS: Last 5 Runtimes (17-21) ---
          - { name: win-msvc-runtime17, os: windows-2022, compiler: msvc, clang-runtime: '17' }
          - { name: win-msvc-runtime18, os: windows-2022, compiler: msvc, clang-runtime: '18' }
          - { name: win-msvc-runtime19, os: windows-2022, compiler: msvc, clang-runtime: '19' }
          - { name: win-msvc-runtime20, os: windows-2022, compiler: msvc, clang-runtime: '20' }
          - { name: win-msvc-runtime21, os: windows-2022, compiler: msvc, clang-runtime: '21' }

          # --- CUSTOM: Debug, coverage, benchmarks, static analysis ---
          - name: ubu24-clang20-runtime22-debug
            os: ubuntu-24.04
            compiler: clang-20
            clang-runtime: '22'
            debug_build: true
            flavor: debug

          - name: ubu24-gcc13-runtime20-benchmarks
            os: ubuntu-24.04
            compiler: gcc-13
            clang-runtime: '20'
            extra_cmake_options: '-DCLAD_ENABLE_BENCHMARKS=On -DCLAD_ENABLE_ENZYME_BACKEND=On'
            extra_packages: "libomp-20-dev libopenblas-dev"
            benchmark: true

          - name: ubu22-clang13-runtime13-cuda
            os: ubuntu-22.04
            compiler: clang-13
            clang-runtime: '13'

          - name: ubuntu-clang15-runtime16-doc
            os: ubuntu-latest
            compiler: clang-15
            clang-runtime: '16'
            doc_build: true

          - name: ubu24-clang16-runtime17-shared-libs
            os: ubuntu-24.04
            compiler: clang-16
            extra_cmake_options: '-DBUILD_SHARED_LIBS=On'
            clang-runtime: '17'

          - name: ubu22-clang16-runtime22-kokkos
            os: ubuntu-22.04
            compiler: clang-16
            clang-runtime: '22'
            kokkos: '5.1.1'
            extra_packages: 'ninja-build'
            extra_cmake_options: '-G Ninja'


          # Valgrind over the binaries, not over clang. check-clad-execonly
          # is where the execution tests are collected -- it re-runs the
          # suite checking what the programs print rather than what the
          # compiler did -- so it is what this row runs. Nothing here needs
          # the from-source LLVM recipe, since clang is not the process being
          # watched; the full run is build-valgrind, on push.
          #
          # The runtime matches the compiler so that libomp-20-dev, which the
          # Linux setup installs for the runtime major, serves both: the
          # OpenMP tests are the ones this row is most worth running, since
          # what a parallel region does to memory is what nothing else here
          # checks. Which LLVM builds the plugin does not matter to that.
          - name: ubu24-clang20-runtime20-vg-exec
            os: ubuntu-24.04
            compiler: clang-20
            extra_packages: 'valgrind'
            extra_cmake_options: '-DCLAD_TEST_VG_EXEC_ONLY=On'
            test_target: check-clad-execonly
            clang-runtime: '20'

          - name: ubu24-arm-clang16-runtime17-shared-libs
            os: ubuntu-24.04-arm
            compiler: clang-16
            extra_cmake_options: '-DBUILD_SHARED_LIBS=On'
            clang-runtime: '17'

          - name: ubu24-arm-clang16-runtime22-kokkos
            os: ubuntu-24.04-arm
            compiler: clang-16
            clang-runtime: '22'
            kokkos: '5.1.1'
            extra_packages: 'ninja-build'
            extra_cmake_options: '-G Ninja'

          - name: ubu24-arm-clang16-runtime18
            os: ubuntu-24.04-arm
            compiler: clang-16
            clang-runtime: '18'

    steps: &build_steps
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.11
    - name: Setup default Build Type on *nux
      if: ${{ (matrix.debug_build != true) && (runner.os != 'windows') }}
      run: |
        echo "BUILD_TYPE=Release" >> $GITHUB_ENV
        echo "CLAD_CODE_COVERAGE=0" >> $GITHUB_ENV
    - name: Setup default Build Type on *nux (build_debug & asserts)
      if: ${{ (matrix.debug_build == true) && (runner.os != 'windows') }}
      run: |
        echo "BUILD_TYPE=Debug" >> $GITHUB_ENV
        # Cleanup some space: https://github.com/orgs/community/discussions/25678
        # Under nektos/act this path is a bind-mount, so the mountpoint itself
        # cannot be removed ("Device or resource busy"); tolerate that so the
        # debug row is reproducible locally.
        rm -fr /opt/hostedtoolcache || true
    - name: Setup default Build Type on Windows
      if: runner.os == 'windows'
      run: |
        $env:BUILD_TYPE="Release"
        $env:CLAD_CODE_COVERAGE="0"
        echo "BUILD_TYPE=Release" >> $env:GITHUB_ENV
        echo "CLAD_CODE_COVERAGE=0" >> $env:GITHUB_ENV
    - name: Compute ncpus (cgroup-aware)
      if: runner.os != 'windows'
      run: |
        if [[ "${{ runner.os }}" == "macOS" ]]; then
          ncpus=$(sysctl -n hw.ncpu)
        else
          ncpus=$(nproc)
          if [[ -r /sys/fs/cgroup/cpu.max ]]; then
            read -r quota period < /sys/fs/cgroup/cpu.max || true
            if [[ "${quota:-max}" != "max" && "${period:-0}" -gt 0 ]]; then
              capped=$(( (quota + period - 1) / period ))
              if [[ "$capped" -ge 1 && "$capped" -lt "$ncpus" ]]; then
                ncpus="$capped"
              fi
            fi
          fi
        fi
        echo "ncpus=$ncpus" >> $GITHUB_ENV
    - name: Setup LLVM ${{ matrix.clang-runtime }}${{ matrix.flavor && format(' [{0}]', matrix.flavor) || '' }}
      if: runner.os != 'Windows'
      uses: compiler-research/ci-workflows/actions/setup-llvm@main
      with:
        version: ${{ matrix.clang-runtime }}
        os:      ${{ matrix.self-hosted-os || matrix.os }}
        # use-recipe=true selects setup-llvm's empty flavor (the vanilla
        # from-source llvm-release recipe); the `|| 'system'` default cannot
        # emit that empty string on its own.
        flavor:  ${{ matrix.use-recipe != 'true' && (matrix.flavor || 'system') || '' }}

    - name: Setup Kokkos ${{ matrix.kokkos }}
      if: matrix.kokkos && runner.os != 'Windows'
      uses: compiler-research/ci-workflows/actions/setup-kokkos@main
      with:
        version: ${{ matrix.kokkos }}
        os:      ${{ matrix.self-hosted-os || matrix.os }}

    - name: Install extra Linux deps
      if: runner.os == 'Linux'
      run: |
        # cmake is preinstalled on github-hosted ubuntu-24.04 but absent
        # from catthehacker/ubuntu:act-24.04; install it so bin/repro works.
        # The debug row needs it too (to build clad), so this step must not
        # be gated on debug_build.
        #
        # Install against the image's package lists and refresh them only if
        # that fails. They go stale just when the archive supersedes a
        # dependency and drops the old .deb -- valgrind pulls libc6-dbg,
        # whose 2.39-0ubuntu8.7 build stopped being fetchable -- so an
        # unconditional update would cost every Linux row on every run to
        # cover a rare event. Same shape as the clang install below.
        apt_install() {
          sudo apt-get install -y "$@" \
            || { sudo apt-get update && sudo apt-get install -y "$@"; }
        }
        apt_install cmake ${{ matrix.extra_packages }}
        # libomp-N-dev: best-effort. apt-llvm.org lags on the latest
        # major; recipe-flavor rows get libomp from the recipe build,
        # not apt. When missing, OpenMP lit tests skip via REQUIRES.
        if apt-cache show "libomp-${{ matrix.clang-runtime }}-dev" >/dev/null 2>&1; then
          apt_install "libomp-${{ matrix.clang-runtime }}-dev"
        fi

    - name: Setup compiler on Linux
      if: runner.os == 'Linux'
      run: |
        # https://www.gnu.org/software/bash/manual/html_node/Shell-Parameter-Expansion.html
        vers="${compiler#*-}"
        os_codename="`cat /etc/os-release | grep UBUNTU_CODENAME | cut -d = -f 2`"
        sudo apt update
        if [[ "${{ matrix.compiler }}" == *"gcc"* ]]; then
          sudo apt install -y gcc-${vers} g++-${vers}
          echo "CC=gcc-${vers}" >> $GITHUB_ENV
          echo "CXX=g++-${vers}" >> $GITHUB_ENV
        else
          if ! sudo apt install -y clang-${vers}; then
            curl https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
            echo "deb https://apt.llvm.org/${os_codename}/ llvm-toolchain-${os_codename}-${vers} main" | sudo tee -a /etc/apt/sources.list
            sudo apt update
            sudo apt install -y clang-${vers}
          fi
          echo "CC=clang-${vers}" >> $GITHUB_ENV
          echo "CXX=clang++-${vers}" >> $GITHUB_ENV
        fi
      env:
        compiler: ${{ matrix.compiler }}
    - name: Setup compiler on macOS
      if: runner.os == 'macOS'
      run: |
        if [[ "${{ matrix.compiler }}" == *"clang"* ]]; then
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
        else
          echo "Unsupported compiler - fix YAML file"
        fi
    - name: Setup compiler on Windows
      if: runner.os == 'windows'
      run: |
        if ( "${{ matrix.compiler }}" -imatch "clang" )
        {
          $ver="${{ matrix.compiler }}".split("-")[1]
          choco install llvm --version=$ver --no-progress -my
          $env:PATH_TO_LLVM_BUILD="$env:ProgramFiles\LLVM"
          echo "PATH_TO_LLVM_BUILD=$env:PATH_TO_LLVM_BUILD"
          echo "PATH_TO_LLVM_BUILD=$env:PATH_TO_LLVM_BUILD" >> $env:GITHUB_ENV
          clang --version
          #
          $env:CC="clang"
          $env:CXX="clang++"
          echo "CC=clang" >> $env:GITHUB_ENV
          echo "CXX=clang++" >> $env:GITHUB_ENV
        }
        elseif ( "${{ matrix.compiler }}" -imatch "msvc" )
        {
          # MSVC is builtin in container image
        }
        else
        {
          echo "Unsupported compiler - fix YAML file"
        }

    - name: Setup LLVM extras on macOS
      if: runner.os == 'macOS'
      run: |
        # setup-llvm ran `brew install llvm@N` above; pick the prefix
        # and copy SDK headers into /usr/local/include/ (ln fails on
        # macOS-arm runners, so we copy).
        PATH_TO_LLVM_BUILD=$(brew --prefix llvm@${{ matrix.clang-runtime }})
        pip3 install lit
        sudo cp -r -n $(xcrun --show-sdk-path)/usr/include/ /usr/local/include/
        echo "PATH_TO_LLVM_BUILD=$PATH_TO_LLVM_BUILD" >> $GITHUB_ENV

    - name: Setup LLVM/Clang on Linux
      if: ${{ runner.os == 'Linux' }}
      run: |
        # setup-llvm always lands the install at $GITHUB_WORKSPACE/install
        # (a symlink to /usr/lib/llvm-N for flavor=system, a real install
        # tree for the recipe flavors). Point clad's build prefix there so
        # the cmake configs and their .a references resolve regardless of
        # flavor.
        PATH_TO_LLVM_BUILD="$GITHUB_WORKSPACE/install"
        pip3 install lit # LLVM lit is not part of the llvm releases...
        echo "PATH_TO_LLVM_BUILD=$PATH_TO_LLVM_BUILD" >> $GITHUB_ENV
    - name: Setup LLVM/Clang on Windows
      if: ${{ runner.os == 'windows' }}
      run: |
        C:\Miniconda\condabin\conda.bat install -y -c conda-forge "clangdev=${{ matrix.clang-runtime }}"
        $env:PATH_TO_LLVM_BUILD="$env:CONDA\Library"
        pip3 install lit # LLVM lit is not part of the llvm releases...
        echo "Runtime LLVM/Clang: $env:PATH_TO_LLVM_BUILD"
        echo "PATH_TO_LLVM_BUILD=$env:PATH_TO_LLVM_BUILD"
        echo "PATH_TO_LLVM_BUILD=$env:PATH_TO_LLVM_BUILD" >> $env:GITHUB_ENV
    # Headers only: enough to compile a .cu, which is all a runner with no
    # GPU can do. The self-hosted rows bring their own toolkit and run the
    # tests for real, so they are left alone.
    - name: Setup CUDA headers
      if: ${{ matrix.cuda && !contains(matrix.os, 'self-hosted') }}
      uses: compiler-research/ci-workflows/actions/setup-cuda@main
      with:
        version: ${{ matrix.cuda }}
        os: ${{ matrix.os }}
        arch: x86_64
    - name: Setup code coverage
      if: ${{ (matrix.coverage == true) }}
      run: |
        sudo apt install -y lcov
        # Workaround ubuntu lcov-1.15-1 package bug
        if sudo apt list lcov --installed | grep "1.15-1" ; then
          wget https://launchpad.net/ubuntu/+source/lcov/1.15-2/+build/23784466/+files/lcov_1.15-2_all.deb
          sudo apt install -y ./lcov_1.15-2_all.deb
        fi
        echo "CLAD_CODE_COVERAGE=1" >> $GITHUB_ENV
        echo "BUILD_TYPE=Debug" >> $GITHUB_ENV
    - name: Display config *nix
      if: ${{ runner.os != 'windows' }}
      run: |
        cmake --version
        $CC --version
        $CXX --version
        xz --version
        tar --version
        echo "Use Clang/LLVM in $PATH_TO_LLVM_BUILD"
        echo "Building clad in `[[ -z "$BUILD_TYPE" ]] && echo RelWithDebInfo || echo $BUILD_TYPE`"
        python3 --version
    - name: Display config Windows
      if: ${{ runner.os == 'windows' }}
      run: |
        cmake --version
        echo "CC=$env:CC"
        if ( "$env:CC" -ne "" )
        {
          Start-Process -Wait -FilePath "$env:CC" -Verb RunAs -ArgumentList '--version'
        }
        echo "CXX=$env:CXX"
        if ( "$env:CXX" -ne "" )
        {
          Start-Process -Wait -FilePath "$env:CXX" -Verb RunAs -ArgumentList '--version'
        }
        xz --version
        tar --version
        echo "Use Clang/LLVM in $env:PATH_TO_LLVM_BUILD"
        echo "Building clad in $env:BUILD_TYPE"
        python3 --version
    # Build the baseline first, so the touched tests can be run against a
    # clad that does not have the change. Restoring the hunks afterwards
    # rebuilds only what they touch, so this costs one incremental build
    # rather than a second full one.
    - name: Revert functional hunks for the baseline
      if: ${{ runner.os != 'windows' && github.event_name == 'pull_request' }}
      uses: ./.github/actions/observes-change
      with:
        mode: revert
    # Clad is built twice on a pull request -- once with the functional hunks
    # reverted, to show the touched tests failing, and once as written. What
    # the second build reuses from the first depends on what the change
    # touches: a .cpp leaves the other translation units alone, a header most
    # of them include leaves almost nothing. So this pays on some pull
    # requests and not on others, and the stats below are how to tell which.
    #
    # Not on Windows: ccache drives MSVC only with debug information inlined
    # into the objects, which is not how that job is configured.
    - name: Restore the compiler cache
      if: ${{ runner.os != 'windows' }}
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ matrix.name }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ matrix.name }}-

    - name: Set up ccache
      if: ${{ runner.os != 'windows' }}
      run: |
        command -v ccache >/dev/null || {
          if [ "$RUNNER_OS" = "macOS" ]; then brew install -q ccache
          else sudo apt-get install -y -qq ccache; fi
        }
        # Exported here as well as written to the environment file: the file
        # only reaches later steps, and the two commands below are now.
        export CCACHE_DIR="$HOME/.ccache"
        echo "CCACHE_DIR=$CCACHE_DIR" >> $GITHUB_ENV
        # Bounded, because every job keeps one and they share a ten gigabyte
        # allowance with each other and with the 32-bit job's packages. Past
        # the bound ccache evicts its own oldest rather than letting the cache
        # grow until GitHub evicts something that matters.
        ccache --max-size=250M
        ccache --zero-stats

    - name: Build Clad on *nix
      if: ${{ runner.os != 'windows' }}
      run: |
        rm -rf obj && mkdir obj && cd obj
        cmake -DClang_DIR=${{ env.PATH_TO_LLVM_BUILD }}  \
          -DLLVM_DIR=${{ env.PATH_TO_LLVM_BUILD }}       \
          -DCMAKE_BUILD_TYPE=$([[ -z "$BUILD_TYPE" ]] && echo RelWithDebInfo || echo $BUILD_TYPE) \
          -DCLAD_CODE_COVERAGE=${{ env.CLAD_CODE_COVERAGE }}   \
          -DLLVM_EXTERNAL_LIT="`which lit`" \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache   \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DLLVM_ENABLE_WERROR=On           \
          $GITHUB_WORKSPACE                 \
          ${{ matrix.extra_cmake_options }}

        cmake --build . -- -j${{ env.ncpus }}
    - name: Check the touched tests against the baseline
      if: ${{ always() && runner.os != 'windows' && env.observes_check == '1' }}
      uses: ./.github/actions/observes-change
      with:
        mode: check
        platform: ${{ matrix.name }}
        build-dir: obj
        rebuild-command: cmake --build obj -- -j${{ env.ncpus }}
    - name: Report the compiler cache
      if: ${{ !cancelled() && runner.os != 'windows' }}
      # Reports whether the build succeeded or failed, so a job that broke
      # before ccache was installed says that rather than adding an unrelated
      # "command not found" on top of it. Not always(): a cancelled run has
      # nothing to say and should stop.
      run: |
        command -v ccache >/dev/null || { echo "ccache was never installed"; exit 0; }
        ccache --show-stats --verbose || ccache --show-stats

    - name: Upload the baseline verdict
      if: ${{ runner.os != 'windows' && env.observes_check == '1' }}
      uses: actions/upload-artifact@v7
      with:
        name: observes-change-${{ matrix.name }}
        path: observes/
    - name: Build Clad on Windows
      if: ${{ runner.os == 'windows' }}
      run: |
        mkdir obj
        cd obj
        if ( "$env:BUILD_TYPE" -eq "" )
        {
          $env:BUILD_TYPE="RelWithDebInfo"
        }
        if ( "$env:CLAD_CODE_COVERAGE" -eq "" )
        {
          $env:CLAD_CODE_COVERAGE="0"
        }
        ((Get-Content -path C:/Miniconda/Library/lib/cmake/llvm/LLVMConfig.cmake -Raw) -replace 'LLVM_ENABLE_DIA_SDK ON','LLVM_ENABLE_DIA_SDK OFF') | Set-Content -Path C:/Miniconda/Library/lib/cmake/llvm/LLVMConfig.cmake
        $lit = @(which lit)
        cmake -DClang_DIR="$env:PATH_TO_LLVM_BUILD" -DLLVM_DIR="$env:PATH_TO_LLVM_BUILD" -DCMAKE_BUILD_TYPE="$env:BUILD_TYPE" -DCLAD_CODE_COVERAGE="$env:CLAD_CODE_COVERAGE" -DCLAD_BUILD_STATIC_ONLY="ON" -DLLVM_EXTERNAL_LIT="$lit" "$env:GITHUB_WORKSPACE" ${{ matrix.extra_cmake_options }}
        cmake --build . --config Release
    - name: Test Clad on *nix
      if: ${{ runner.os != 'windows' }}
      env:
        # lit reads LIT_OPTS at startup; without it, lit defaults to
        # multiprocessing.cpu_count() which sees the host count and
        # ignores cgroup CFS quotas, over-provisioning workers on
        # constrained containers (cf. the LLVM build step's cap).
        LIT_OPTS: -j${{ env.ncpus }}
      run: |
        cd obj
        # Packages downloaded and unzipped require setting the SDKROOT.
        if [[ "runner.os" == "macOS" ]]; then
          export SDKROOT=`xcrun --show-sdk-path`
        fi
        cmake --build . --target ${{ matrix.test_target || 'check-clad' }} -- -j${{ env.ncpus }}
    - name: Test Clad on Windows
      if: ${{ runner.os == 'windows' }}
      run: |
        cd obj
        #cmake --build . --target check-clad
    - name: Benchmark Clad
      if: ${{ matrix.benchmark }}
      run: |
        baseline_hash=$([[ -z "${{ github.event.pull_request }}" ]] && echo ${{ github.event.before }} || echo ${{ github.event.pull_request.base.sha }})
        current_hash=${{ github.sha }}
        cd benchmark
        python3 benchmark_compare.py ${baseline_hash} ${current_hash} obj
        cd ..
    - name: Test build sphinx & doxygen documentation
      if: ${{ (matrix.doc_build == true) }}
      run: |
        sudo apt-get install -y doxygen graphviz
        pip install --upgrade pip
        pip install -r requirements.txt
        mkdir -p obj && cd obj
        cmake \
          -DClang_DIR="$PATH_TO_LLVM_BUILD" \
          -DLLVM_DIR="$PATH_TO_LLVM_BUILD"  \
          -DCLAD_INCLUDE_DOCS=ON            \
          -DCLAD_ENABLE_DOXYGEN=ON          \
          -DCLAD_ENABLE_SPHINX=ON           \
          -DCMAKE_INSTALL_PREFIX=../inst    \
          -DCMAKE_BUILD_TYPE=Debug          \
          -DLLVM_EXTERNAL_LIT="`which lit`" \
          ..
        cmake --build . --target sphinx-clad doxygen-clad -- -j${{ env.ncpus }}
    - name: Show reproduce-locally hint
      if: ${{ failure() }}
      shell: bash
      env:
        REPO: ${{ github.repository }}
        REPO_NAME: ${{ github.event.repository.name }}
        SHA: ${{ github.sha }}
        ROW: ${{ matrix.name }}
      run: |
        echo "::group::Reproduce this failure locally (requires Docker + nektos/act)"
        cat <<EOF
            git clone https://github.com/compiler-research/ci-workflows.git
            git clone https://github.com/$REPO.git
            cd $REPO_NAME
            git checkout $SHA
            ../ci-workflows/bin/repro $ROW
        EOF
        echo "::endgroup::"
    - name: Failed job config
      if: ${{ failure() && runner.debug && runner.os != 'windows' }}
      env:
        GITHUB_CONTEXT: ${{ toJson(github) }}
      run: |
        echo "$GITHUB_CONTEXT"
        export
        if [[ "runner.os" == "Linux" ]]; then
          apt-mark showhold
          dpkg-query -L libclang-${{ matrix.clang-runtime }}-dev
          dpkg-query -L clang-${{ matrix.clang-runtime }}
          dpkg-query -L llvm-${{ matrix.clang-runtime }}-dev
          find /usr/lib/llvm-${{ matrix.clang-runtime }}/
        fi
        if [[ "runner.os" == "macOS" ]]; then
          brew search llvm
          find /usr/local/opt/llvm@*/
        fi
        pip show lit
        cat obj/CMakeCache.txt
        cat obj/CMakeFiles/*.log
    - name: Setup tmate session
      if: ${{ !cancelled() && runner.debug }}
      uses: mxschmitt/action-tmate@v3
      # When debugging increase to a suitable value!
      timeout-minutes: 30
    - name: Prepare code coverage report
      if: ${{ success() && (matrix.coverage == true) }}
      run: |
        # Create lcov report
        # capture coverage info
        vers="${CC#*-}"
        lcov --directory . --capture --output-file coverage.info --gcov-tool /usr/bin/gcov-${vers} --ignore-errors gcov
        # filter out system and extra files.
        # To also not include test code in coverage add them with full path to the patterns: '*/tests/*'
        lcov --remove coverage.info '/usr/*' "${HOME}"'/.cache/*' \
          "$GITHUB_WORKSPACE"'/test/*' "$GITHUB_WORKSPACE"'/unittests/*' \
          --output-file coverage.info
        # output coverage data for debugging (optional)
        lcov --list coverage.info

    - name: Upload to codecov.io
      if: ${{ success() && (matrix.coverage == true) }}
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.info
        fail_ci_if_error: true
        verbose: true
        token: ${{ secrets.CODECOV_TOKEN }}

  # Self-hosted CUDA rows. Separate job so `prepare-dell` gates only
  # what depends on the dell; the hosted-runner matrix in `build` runs
  # without waiting. Step list shared via the &build_steps anchor.
  build-selfhost:
    needs: prepare-dell
    timeout-minutes: 600 # If the dell is slow to come back up.
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: selfh-ubu22-gcc12-runtime19-analyzers
            os: [self-hosted, cuda, heavy]
            self-hosted-os: ubuntu-22.04
            compiler: gcc-12
            clang-runtime: '19'
            coverage: true
            cuda: true
            extra_cmake_options: '-DCLAD_ENABLE_ENZYME_BACKEND=On -DCLAD_CUDA_TEST_USE_SANITIZER=On'
            extra_packages: ' libzstd-dev '

          - name: selfh-ubu22-clang16-runtime18-cuda
            os: [self-hosted, cuda, heavy]
            self-hosted-os: ubuntu-22.04
            compiler: clang-16
            extra_cmake_options: '-DCLAD_CUDA_TEST_USE_SANITIZER=On'
            clang-runtime: '18'
            cuda: true

    steps: *build_steps

  # Valgrind is the row a pull request would otherwise wait on -- two hours
  # against 8 for an ordinary row -- and it answers a question about master
  # rather than about the change under review. Step list shared via the
  # &build_steps anchor.
  build-valgrind:
    if: ${{ github.event_name == 'push' }}
    timeout-minutes: 360 # Valgrind takes about two hours.
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubu24-clang20-runtime22-vg
            os: ubuntu-24.04
            compiler: clang-20
            extra_packages: 'valgrind'
            extra_cmake_options: '-DCLAD_TEST_USE_VG=On'
            clang-runtime: '22'
            # Run Valgrind against the from-source llvm-release recipe
            # (Release+Asserts), not apt: apt's -O2 binaries read uninitialised
            # bitfield padding in ~399 clang/LLVM sites (llvm/llvm-project#194147)
            # that no surgical suppression can cover. The recipe build tops out
            # in two frames, handled by test/clad-valgrind-llvm22.supp.
            use-recipe: 'true'
    steps: *build_steps

  # A post-merge gate nobody watches is not a gate: the run ends long after
  # its author has moved on. Consecutive failures comment on the open report
  # rather than file another, so a week of red master is one thread.
  valgrind-report:
    needs: build-valgrind
    if: ${{ failure() }}
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
    - name: File the failure against the commit that caused it
      uses: actions/github-script@v9
      with:
        script: |
          const repo = { owner: context.repo.owner, repo: context.repo.repo };
          const commit = context.payload.head_commit || {};
          const author = (commit.author || {});
          // GitHub resolves the commit email to an account when it can; fall
          // back to the name so the report still says whose commit it was.
          const who = author.username ? `@${author.username}`
                                      : (author.name || 'unknown author');
          const run = `${context.serverUrl}/${context.repo.owner}/`
                    + `${context.repo.repo}/actions/runs/${context.runId}`;
          const body = [
            'Valgrind failed on master. It runs after the merge, so the pull',
            'request that introduced this never saw it.',
            '',
            `- commit: ${context.sha} -- ${(commit.message || '').split('\n')[0]}`,
            `- author: ${who}`,
            `- run: ${run}`,
          ].join('\n');
          const LABEL = 'valgrind';
          // The label is what carries the thread from one failure to the
          // next, so it has to exist before anything is filed under it.
          await github.rest.issues.getLabel({ ...repo, name: LABEL }).catch(() =>
            github.rest.issues.createLabel({ ...repo, name: LABEL,
              color: 'b60205', description: 'Post-merge Valgrind failure' }));
          // listForRepo answers with pull requests too; only an issue is a
          // report, and a labelled pull request must not swallow one.
          const open = await github.rest.issues.listForRepo(
            { ...repo, state: 'open', labels: LABEL });
          const report = open.data.find(i => !i.pull_request);
          if (report)
            await github.rest.issues.createComment(
              { ...repo, issue_number: report.number, body });
          else
            await github.rest.issues.create({
              ...repo, body, labels: [LABEL],
              title: `[valgrind] master fails at ${context.sha.slice(0, 8)}`,
            });

  observes-change:
    name: Tests observe the change
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    # The self-hosted rows are the only ones with a GPU, so a CUDA test is
    # measured nowhere else. Waiting for them costs the dell's wake-up time;
    # when it never comes they simply report nothing.
    needs: [build, build-selfhost]
    runs-on: ubuntu-24.04
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        pattern: observes-change-*
        path: verdicts
        merge-multiple: false
      continue-on-error: true
    - name: Decide
      uses: ./.github/actions/observes-change
      with:
        mode: verdict
        verdict-dir: verdicts
    # Keep the per-platform matrix even when the check passes: a test that
    # is never the only one to fail across many changes is a candidate for
    # merging, which is a claim about defects caught rather than lines run.
    - name: Upload the summary record
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: observes-change-summary
        path: observes-change-summary.json
        if-no-files-found: ignore

  build-wasm:
    timeout-minutes: 30
    name: ubu24-emscr-runtime22
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7

    - name: Setup emsdk
      uses: emscripten-core/setup-emsdk@v16
      with:
        # The emsdk pin must match the llvm-wasm cell.
        version: '4.0.9'

    - name: Setup LLVM/Clang/LLD built for wasm
      uses: compiler-research/ci-workflows/actions/setup-recipe@main
      with:
        recipe: llvm-wasm
        version: '22'
        os: ubuntu-24.04
        arch: x86_64

    - name: Build Clad for wasm
      run: |
        LLVM_BUILD_DIR="$(pwd)/install/build"
        mkdir obj && cd obj
        emcmake cmake -DCMAKE_BUILD_TYPE=Release \
          -DLLVM_DIR=$LLVM_BUILD_DIR/lib/cmake/llvm \
          -DClang_DIR=$LLVM_BUILD_DIR/lib/cmake/clang \
          -DLLD_DIR=$LLVM_BUILD_DIR/lib/cmake/lld \
          -DCLAD_BUILD_STATIC_ONLY=ON \
          -DLLVM_ENABLE_WERROR=On \
          $GITHUB_WORKSPACE
        emmake make -j$(nproc)

    - name: Run the unittests under node
      run: emmake make -j$(nproc) -C obj check-clad

# -*- Python -*-

import platform

import lit.formats
import lit.util

import os
import re

# How a test launches what it just built: './prog' in the older ones, '%t'
# with or without a suffix, or a file under it, in the newer ones. Matched
# only in command position -- after the %dbg(RUN: at line N) lit puts in
# front of every line, or after a pipe -- so that the same names as
# arguments, '-o %t' or '-fmodules-cache-path=%t/cache', are left alone.
PROGRAM = r'(^\s*(?:%dbg\([^)]*\)\s*)?|(?<=\|)\s*)(\./\S+|%t\S*)'

# Valgrind over those binaries, when asked for. This is the place that knows
# how a test starts its program, so it is the place that can put something in
# front of it. --leak-check=full because a leak is what a bug in generated
# code most often looks like: a tape or an adjoint array that is allocated
# and never freed. lit's own --vg wraps every command instead, the compile
# included, and runs with --leak-check=no.
WRAPPER = ''
if lit_config.params.get('vg_exec_only'):
    if lit_config.useValgrind:
        lit_config.fatal('vg_exec_only and --vg are alternatives; pick one')
    _valgrind = lit.util.which('valgrind')
    if not _valgrind:
        lit_config.fatal('vg_exec_only was asked for but valgrind was not found')
    WRAPPER = _valgrind + ' -q --error-exitcode=1 --leak-check=full '

class ExecOnlyFormat(lit.formats.ShTest):
    def getTestsInDirectory(self, testSuite, path_in_suite, litConfig, localConfig):
        cur_path = os.path.dirname(__file__)
        tests = list()
        # FIXME: Find the tests we put in the ExecOnly folder. This currently
        # fails with some sort of obscure error in pickle:
        #  _pickle.PicklingError: Can't pickle <class
        #   'lit.TestingConfig.ExecOnlyFormat'>: attribute lookup ExecOnlyFormat
        #   on lit.TestingConfig failed
        #
        #for t in super().getTestsInDirectory(testSuite, path_in_suite, litConfig, localConfig):
        #    tests.append(t)

        base = os.path.abspath(os.path.join(cur_path, os.pardir))
        tests.extend(lit.discovery.find_tests_for_inputs(lit_config, [base]))
        for test in tests :
            # The sink has to read all of stdin -- 'true' on its own leaves
            # the compiler writing into a closed pipe -- and to ignore the
            # file name that follows %filecheck. 'xargs -0 true' did both
            # until the output grew: -ftime-report gives Misc/TimingsReport.C
            # more than ARG_MAX, and xargs refuses.
            # Not %filecheck_exec, which this view exists to keep: lit
            # substitutions are regexes applied in order, and a bare
            # '%filecheck' pattern claims the prefix of the longer name and
            # leaves a stray '_exec' behind, so the program's output went
            # unchecked and only its exit status was judged.
            test.config.substitutions.insert(
                0, (r'%filecheck(?!_exec)', 'sh -c "cat >/dev/null" '))
            if WRAPPER:
                wrap = (PROGRAM, r'\1' + WRAPPER + r'\2')
                # The tests can share one config object, so ask before adding.
                if wrap not in test.config.substitutions:
                    test.config.substitutions.insert(0, wrap)
            # An XFAIL in these tests records something about the compile
            # output, which this view does not look at, so passing without
            # that check is not news -- and reporting it as XPASS would fail
            # a healthy tree. This is the field --xfail-not sets; a genuine
            # execution failure is still reported as one.
            test.xfail_not = True
            # FIXME: We run there the tests twice but it seems there is nothing
            # else we could do.
            test.config.name = "clad Execution-Only"
            yield test

# We exclude the `ExecOnly` folder from the main configuration so that here we
# can add a custom formatter that re-runs the existing tests by ignoring the
# produced output comparisons but checks only the final excution result.
config.test_format = ExecOnlyFormat()
